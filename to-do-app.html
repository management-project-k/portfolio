<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo App</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#f5f7fa; font-family:system-ui,sans-serif; padding:20px; }
    .container { max-width:500px; margin:0 auto; background:white; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.1); overflow:hidden; }
    h1 { background:linear-gradient(135deg,#667eea,#764ba2); color:white; padding:24px; text-align:center; font-size:24px; }
    .input-box { padding:20px; display:flex; border-bottom:1px solid #eee; }
    #taskInput { flex:1; padding:14px; font-size:16px; border:2px solid #ddd; border-radius:12px; }
    #taskInput:focus { outline:none; border-color:#667eea; }
    #addBtn { margin-left:12px; padding:0 20px; background:#667eea; color:white; border:none; border-radius:12px; cursor:pointer; font-weight:bold; }
    #addBtn:hover { background:#5a6fd8; }
    #taskList { list-style:none; }
    .task { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid #f0f0f0; transition:0.2s; }
    .task:hover { background:#f8f9ff; }
    .task.completed { opacity:0.7; }
    .task.completed .task-text { text-decoration:line-through; color:#999; }
    .task input[type=checkbox] { margin-right:16px; transform:scale(1.3); cursor:pointer; }
    .task .date { margin:0 12px; color:#667eea; font-weight:bold; font-size:14px; }
    .task .task-text { flex:1; font-size:16px; }
    .task button { background:none; border:none; font-size:18px; cursor:pointer; padding:4px; }
    .editBtn { color:#667eea; }
    .deleteBtn { color:#e74c3c; }
    .footer { padding:16px 20px; display:flex; justify-content:space-between; background:#f8f9ff; font-size:14px; }
    #clearCompleted { background:#e74c3c; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; }
    #clearCompleted:hover { background:#c0392b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My ToDo App</h1>
    <div class="input-box">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autofocus>
      <button id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>
    <div class="footer">
      <span id="pendingCount">0 items left</span>
      <button id="clearCompleted">Clear Completed</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlQ0hAxMifOLLUe5xsrHAUfIA6KyPjN3fsE1LQW_SMk7sVHieBDgyWTGOtsCHLr02Abg/exec";   // ← ONLY CHANGE THIS LINE

    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const pendingCount = document.getElementById("pendingCount");
    const clearCompleted = document.getElementById("clearCompleted");

    async function api(action, params = {}) {
      const url = new URL(SCRIPT_URL);
      url.searchParams.append("action", action);
      Object.entries(params).forEach(([k,v]) => url.searchParams.append(k, v));
      const res = await fetch(url, {method:"POST"});
      return await res.json();
    }

    async function loadTasks() {
      const data = await api("getAll");
      if (data.success) {
        taskList.innerHTML = "";
        data.tasks.forEach(t => addTaskToDOM(t));
        updateCount();
      }
    }

    function addTaskToDOM(t) {
      const li = document.createElement("li");
      li.className = "task" + (t.completed ? " completed" : "");
      li.dataset.row = t.row;
      li.innerHTML = `
        <input type="checkbox" ${t.completed?"checked":""}>
        <span class="date">${t.date}</span>
        <span class="task-text">${escapeHtml(t.task)}</span>
        <button class="editBtn" title="Edit">Edit</button>
        <button class="deleteBtn" title="Delete">Delete</button>
      `;

      li.querySelector("input[type=checkbox]").onclick = async () => {
        await api("toggle", {row: t.row});
        li.classList.toggle("completed");
        updateCount();
      };

      li.querySelector(".editBtn").onclick = async () => {
        const newText = prompt("Edit task:", t.task);
        if (newText && newText.trim()) {
          await api("edit", {row: t.row, task: newText.trim()});
          li.querySelector(".task-text").textContent = escapeHtml(newText.trim());
        }
      };

      li.querySelector(".deleteBtn").onclick = async () => {
        if (confirm("Delete this task?")) {
          await api("delete", {row: t.row});
          li.remove();
          updateCount();
        }
      };

      taskList.appendChild(li);
    }

    function updateCount() {
      const pending = document.querySelectorAll(".task:not(.completed)").length;
      pendingCount.textContent = `${pending} item${pending!==1?'s':''} left`;
    }

    addBtn.onclick = async () => {
      const text = taskInput.value.trim();
      if (!text) return taskInput.focus();
      await api("add", {task: text});
      taskInput.value = "";
      loadTasks();
    };

    clearCompleted.onclick = async () => {
      if (confirm("Remove all completed tasks?")) {
        await api("clearCompleted");
        loadTasks();
      }
    };

    taskInput.addEventListener("keyup", e => { if (e.key==="Enter") addBtn.click(); });

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadTasks();
  </script>
</body>
</html>
